name: ArchFox PR Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    
    # Spin up a Neo4j database and wait for it to be healthy!
    services:
      neo4j:
        image: neo4j:5
        env:
          NEO4J_AUTH: neo4j/kitsune_password
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd="wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        
      - name: Checkout ArchFox
        uses: actions/checkout@v4
        with:
          repository: SayantanBong007/ArchFox
          path: archfox_tool
          
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install ArchFox Dependencies
        run: |
          cd archfox_tool
          pip install -r requirements.txt
          
      - name: Run ArchFox Review
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd archfox_tool
          python apps/cli/main.py --repo https://github.com/${{ github.repository }} --pr ${{ github.event.pull_request.number }}
