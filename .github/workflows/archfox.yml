name: ArchFox PR Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    
    # Spin up Neo4j 4.4 (Stable and lightweight for CI)
    services:
      neo4j:
        image: neo4j:4.4
        env:
          NEO4J_AUTH: neo4j/kitsune_password
        ports:
          - 7687:7687
    
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        
      - name: Checkout ArchFox
        uses: actions/checkout@v4
        with:
          repository: SayantanBong007/ArchFox
          path: archfox_tool
          
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Wait for Neo4j to be ready
        run: |
          sudo apt-get update -y
          sudo apt-get install -y netcat-openbsd
          
          # Wait up to 2 minutes for Neo4j
          for i in {1..40}; do
            if nc -z localhost 7687; then
              echo "Neo4j Bolt port reachable!"
              exit 0
            fi
            echo "Waiting for Neo4j... ($i/40)"
            sleep 3
          done
          
          echo "ERROR: Neo4j never started! Check the 'Initialize containers' step logs."
          exit 1
          
      - name: Install ArchFox Dependencies
        run: |
          cd archfox_tool
          pip install -r requirements.txt
          
      - name: Run ArchFox Review
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd archfox_tool
          python apps/cli/main.py --repo https://github.com/${{ github.repository }} --pr ${{ github.event.pull_request.number }}
