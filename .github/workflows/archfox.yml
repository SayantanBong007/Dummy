name: ArchFox PR Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    
    services:
      neo4j:
        image: neo4j:5
        env:
          NEO4J_AUTH: neo4j/kitsune_password
          NEO4J_server_default__listen__address: 0.0.0.0
        ports:
          - 7687:7687
    
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        
      - name: Checkout ArchFox
        uses: actions/checkout@v4
        with:
          repository: SayantanBong007/ArchFox
          path: archfox_tool
          
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Wait for Neo4j to be ready
        run: |
          sudo apt-get update -y
          sudo apt-get install -y netcat-openbsd
          for i in {1..40}; do
            if nc -z localhost 7687; then
              echo "Neo4j Bolt port reachable!"
              break
            fi
            echo "Waiting for Neo4j... ($i/40)"
            sleep 3
          done
          
      - name: Install ArchFox Dependencies
        run: |
          cd archfox_tool
          pip install -r requirements.txt
          
      - name: Run ArchFox Review
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd archfox_tool
          python apps/cli/main.py --repo https://github.com/${{ github.repository }} --pr ${{ github.event.pull_request.number }}
